name: Vispace

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  defaultConfig: Release
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  VispaceCore:
    path: Packages/VispaceCore

targets:
  Vispace:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    supportedDestinations:
      - iOS
    sources:
      - path: Vispace
        type: syncedFolder
        excludes:
          - Resources
      # XcodeGen discovers string-catalog locales only in enumerated groups.
      # Keep resources explicit so regeneration retains Korean without manual
      # edits to knownRegions or duplicate resource membership.
      - path: Vispace/Resources
        type: group
        group: App Resources
        createIntermediateGroups: false
    dependencies:
      - package: VispaceCore
        product: VispaceCore
    settings:
      base:
        PRODUCT_NAME: Vispace
        PRODUCT_BUNDLE_IDENTIFIER: com.l3j.vispace
        # XcodeGen's iOS application preset otherwise injects `AppIcon` even
        # though no approved shipping icon asset exists yet.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Do not let the application preset override the machine's approved
        # xcconfig identity. Inherit Xcode's default when none is configured.
        CODE_SIGN_IDENTITY: "$(inherited)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Vispace
        INFOPLIST_KEY_NSCameraUsageDescription: Vispace needs camera access to show the space around you in real time.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiredDeviceCapabilities:
          - arkit
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: "YES"

  VispaceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    supportedDestinations:
      - iOS
    sources:
      - path: VispaceTests
        type: syncedFolder
    dependencies:
      - target: Vispace
      - package: VispaceCore
        product: VispaceCore
    settings:
      base:
        PRODUCT_NAME: VispaceTests
        PRODUCT_BUNDLE_IDENTIFIER: com.l3j.vispace.tests
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vispace.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Vispace"

  VispaceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    supportedDestinations:
      - iOS
    sources:
      - path: VispaceUITests
        type: syncedFolder
    dependencies:
      - target: Vispace
    settings:
      base:
        PRODUCT_NAME: VispaceUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.l3j.vispace.uitests
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Vispace

schemes:
  Vispace:
    build:
      targets:
        Vispace: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: VispaceTests
          parallelizable: true
          randomExecutionOrder: false
        - name: VispaceUITests
          parallelizable: false
          randomExecutionOrder: false
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
